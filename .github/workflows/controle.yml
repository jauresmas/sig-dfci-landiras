name: Contrôle

on:
  push:
  pull_request:

jobs:
  modele-postgis:
    name: Modèle de données PostGIS
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dfci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
      PGDATABASE: dfci
    steps:
      - uses: actions/checkout@v4
      - name: Création du schéma
        run: psql -v ON_ERROR_STOP=1 -q -f sql/schema_dfci_postgis.sql
      - name: Tests (déclencheurs, contraintes, vues)
        run: psql -v ON_ERROR_STOP=1 -q -f sql/tests_schema.sql

  python:
    name: Qualité du code Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
